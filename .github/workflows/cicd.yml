name: Cold Chain IoT CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout Source Code
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2: Set up Python Environment & Linting
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies & Code Linting
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Stop build if there are Python syntax errors
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

    # Step 3: Authenticate to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 4: Build & Push Docker Image
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/coldchain-iot:v1.0.0
          ${{ secrets.DOCKERHUB_USERNAME }}/coldchain-iot:latest

    # Step 5: Validate Kubernetes Manifests
    - name: Set up Kubeconfig & Validate Manifests
      run: |
        kubectl apply --dry-run=client -f configmap.yaml
        kubectl apply --dry-run=client -f deployment.yaml
        kubectl apply --dry-run=client -f service.yaml
