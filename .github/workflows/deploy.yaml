name: Industrial IoT CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # STAGE 1: Continuous Integration (Lint, Test, Docker Build & Push)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies and Test Logic
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Run python compilation check on application
          python -m py_compile app.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iot-predictive-maintenance:v1.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/iot-predictive-maintenance:latest

  # STAGE 2: Continuous Deployment (Kubernetes Rollout)
  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Substitute Docker Image and Deploy Manifests
        run: |
          # Replace username placeholder inside deployment manifest
          sed -i 's/<your-dockerhub-username>/${{ secrets.DOCKERHUB_USERNAME }}/g' k8s/deployment.yaml
          
          # Apply manifests to cluster
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          
          # Force rollout check to verify non-breaking update
          kubectl rollout status deployment/iot-predictive-maintenance